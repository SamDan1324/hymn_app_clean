name: hymn_app
description: A Christian hymn app with audio and themes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  google_fonts: ^6.2.1
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  dio: ^5.4.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hymns_all.json